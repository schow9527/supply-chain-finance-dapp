name: Clean-room application verification

on:
  push:
    branches:
      - feature/backend-member2
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  clean-room:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: development
      PROCESS_ROLE: web
      EVENT_SYNC_ENABLED: "false"
      STORAGE_BACKEND: local
      SECRET_KEY: ci-only-placeholder-not-for-production
      WEB3_PROVIDER_URI: ""
      CHAIN_ID: "11155111"
      SYNC_START_BLOCK: "11869257"
      PORT: "5050"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure isolated CI paths
        shell: bash
        run: |
          echo "DATABASE_URL=sqlite+pysqlite:///$RUNNER_TEMP/scf-clean-room.sqlite3" >> "$GITHUB_ENV"
          echo "UPLOAD_FOLDER=$RUNNER_TEMP/uploads" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/uploads"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify backend dependencies and syntax
        run: |
          python -m pip check
          python -m compileall backend app.py

      - name: Upgrade and check temporary SQLite database
        run: |
          python -m flask --app app:app db upgrade
          python -m flask --app app:app db check

      - name: Run backend tests with coverage
        run: python -m pytest backend/tests --cov=backend --cov-report=term-missing

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install and test frontend
        working-directory: frontend
        run: |
          npm install
          npm test
          find static/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Start Flask and run HTTP smoke tests
        shell: bash
        run: |
          set -euo pipefail
          python -m flask --app app:app run \
            --host 127.0.0.1 --port "$PORT" --no-debugger --no-reload \
            >"$RUNNER_TEMP/flask.log" 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent "http://127.0.0.1:$PORT/api/health/live" >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "Flask did not become ready within 30 seconds"
            tail -n 100 "$RUNNER_TEMP/flask.log"
            exit 1
          fi

          python scripts/ci_smoke.py "http://127.0.0.1:$PORT"
