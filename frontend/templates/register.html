{% extends "base.html" %}

{% block title %}企业入驻申请 | SCF DApp{% endblock %}

{% block content %}
<main class="container">
    <div class="form-card">
        <h2 style="margin-bottom:0.5rem; text-align:center;">🏢 企业入驻注册申请</h2>
        <p class="form-hint" style="text-align:center; margin-bottom:1.5rem;">
            完成注册后，管理员将在链上授予对应的智能合约角色。
        </p>

        <div id="reg-status-banner" class="hidden" style="margin-bottom:1rem; padding:0.75rem; border-radius:6px;"></div>

        <form id="register-form" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label>绑定钱包地址 (MetaMask)</label>
                <input type="text" id="wallet-address-input" class="form-control" readonly placeholder="请先连接 MetaMask 钱包">
                <div class="form-hint">当前连接的以太坊钱包地址</div>
            </div>

            <div class="form-group">
                <label>企业名称 <span style="color:var(--danger)">*</span></label>
                <input type="text" id="enterprise-name-input" class="form-control" required placeholder="例如：深圳信诺供应链有限公司">
            </div>

            <div class="form-group">
                <label>联系人姓名 / 邮箱 <span style="color:var(--danger)">*</span></label>
                <input type="text" id="contact-person-input" class="form-control" required placeholder="例如：张经理 (contact@supplier.com)">
            </div>

            <div class="form-group">
                <label>申请入驻角色 <span style="color:var(--danger)">*</span></label>
                <select id="role-select" class="form-control" required>
                    <option value="SUPPLIER">供应商 (Supplier) - 开具发票并申请应收账款贴现</option>
                    <option value="CORE_ENTERPRISE">核心企业 (Core Enterprise) - 采购大厂核验应付与到期清算</option>
                    <option value="FINANCIER">资金方 (Financier) - 商业银行或保理机构提供资金</option>
                </select>
            </div>

            <button type="submit" id="submit-reg-btn" class="btn btn-primary" style="width:100%;">提交入驻审核申请</button>
        </form>
    </div>
</main>
{% endblock %}

{% block scripts %}
<script>
async function checkMyRegistration() {
    if (!window.DAppState.account) return;
    document.getElementById("wallet-address-input").value = window.DAppState.account;

    try {
        const me = await window.DAppState.apiClient.getMe(window.DAppState.account);
        const banner = document.getElementById("reg-status-banner");
        if (me && me.status) {
            banner.classList.remove("hidden");
            if (me.status === "PENDING") {
                banner.style.background = "#fef3c7";
                banner.style.color = "#b45309";
                banner.innerHTML = `<strong>审核状态：</strong>已提交申请，正在等待平台管理员链上授权...`;
                document.getElementById("submit-reg-btn").disabled = true;
                document.getElementById("submit-reg-btn").innerText = "审核处理中...";
            } else if (me.status === "APPROVED") {
                banner.style.background = "#d1fae5";
                banner.style.color = "#065f46";
                banner.innerHTML = `<strong>已核准：</strong>企业已通过审核，当前角色：<b>${window.AppConfig.ROLE_LABELS[me.role] || me.role}</b>`;
            } else if (me.status === "REJECTED") {
                banner.style.background = "#fee2e2";
                banner.style.color = "#991b1b";
                banner.innerHTML = `<strong>已被驳回：</strong>原因：${me.reject_reason || "未注明"}。可修改后重新提交。`;
            }
        }
    } catch (_) {}
}

async function handleRegister(e) {
    e.preventDefault();
    if (!window.DAppState.account) {
        UIFeedback.showToast("请先在右上角连接 MetaMask 钱包！", "warning");
        return;
    }

    const payload = {
        wallet_address: window.DAppState.account,
        enterprise_name: document.getElementById("enterprise-name-input").value.trim(),
        contact_person: document.getElementById("contact-person-input").value.trim(),
        role_applied: document.getElementById("role-select").value
    };

    try {
        const res = await window.DAppState.apiClient.registerEnterprise(payload);
        UIFeedback.showToast("企业入驻申请已成功提交，请等待管理员审核！", "success");
        await checkMyRegistration();
    } catch (err) {
        UIFeedback.showToast(err.message || "提交失败", "error");
    }
}

document.addEventListener("DOMContentLoaded", () => {
    setTimeout(checkMyRegistration, 600);
});
</script>
{% endblock %}
