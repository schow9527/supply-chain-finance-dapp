databases:
  - name: supply-chain-finance-db
    plan: 0.1c-256mb
    region: singapore
    databaseName: supply_chain_finance
    user: supply_chain_finance

services:
  - type: web
    name: supply-chain-finance-web
    runtime: python
    plan: 0.5c-512mb
    region: singapore
    buildCommand: pip install -r requirements.txt
    preDeployCommand: flask --app app:app db upgrade
    startCommand: gunicorn app:app
    healthCheckPath: /api/health/ready
    envVars:
      - key: APP_ENV
        value: production
      - key: PROCESS_TYPE
        value: web
      - key: DATABASE_URL
        fromDatabase:
          name: supply-chain-finance-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB3_PROVIDER_URI
        sync: false
      - key: CHAIN_ID
        value: "11155111"
      - key: EVENT_SYNC_ENABLED
        value: "false"
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_KEY_PREFIX
        value: production

  - type: worker
    name: supply-chain-finance-event-worker
    runtime: python
    plan: 0.5c-512mb
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python -m backend.worker
    envVars:
      - key: APP_ENV
        value: production
      - key: PROCESS_TYPE
        value: worker
      - key: DATABASE_URL
        fromDatabase:
          name: supply-chain-finance-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB3_PROVIDER_URI
        sync: false
      - key: CHAIN_ID
        value: "11155111"
      - key: EVENT_SYNC_ENABLED
        value: "true"
      - key: STORAGE_BACKEND
        value: disabled
