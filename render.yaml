databases:
  - name: supply-chain-finance-db
    plan: 0.1c-256mb
    region: singapore
    databaseName: supply_chain_finance
    user: supply_chain_finance

services:
  - type: web
    name: supply-chain-finance-web
    runtime: python
    plan: 0.5c-512mb
    region: singapore
    numInstances: 1
    buildCommand: pip install -r requirements.txt
    preDeployCommand: flask --app app:app db upgrade
    startCommand: gunicorn app:app
    healthCheckPath: /api/health/ready
    disk:
      name: invoice-pdf-data
      mountPath: /opt/render/project/src/uploads
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: PROCESS_ROLE
        value: web
      # Set this service's Internal Database URL manually in the Render Dashboard.
      # It must target the isolated supply_chain_finance_v2 logical database.
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: WEB3_PROVIDER_URI
        sync: false
      - key: CHAIN_ID
        value: "11155111"
      - key: EVENT_SYNC_ENABLED
        value: "false"
      - key: STORAGE_BACKEND
        value: render_disk
      - key: RENDER_DISK_MOUNT_PATH
        value: /opt/render/project/src/uploads
      - key: UPLOAD_FOLDER
        value: /opt/render/project/src/uploads
      - key: WEB_INSTANCE_COUNT
        value: "1"

  - type: worker
    name: supply-chain-finance-event-worker
    runtime: python
    plan: 0.5c-512mb
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python -m backend.worker
    envVars:
      - key: APP_ENV
        value: production
      - key: PROCESS_ROLE
        value: worker
      # Set this service's Internal Database URL manually in the Render Dashboard.
      # It must match the Web service and target supply_chain_finance_v2.
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: WEB3_PROVIDER_URI
        sync: false
      - key: CHAIN_ID
        value: "11155111"
      - key: EVENT_SYNC_ENABLED
        value: "true"
      - key: EVENT_SYNC_BATCH_SIZE
        value: "10"
      - key: SYNC_START_BLOCK
        value: "11869257"
      - key: STORAGE_BACKEND
        value: disabled
